[project]
name = "stock-portfolio-analyzer"
version = "0.1.0"
description = "Streamlit app to analyze a stock portfolio from transaction history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.50",
    "yfinance>=0.2.50",
]

[dependency-groups]
demo = [
    "imageio-ffmpeg>=0.6",
    "pillow>=12.3",
    "playwright>=1.63",
]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
